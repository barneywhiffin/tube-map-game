<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fewest changes: London shortest-route game</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f1f4f8;--ink:#0b1b33;--mute:#5a6a82;--card:#fff;--bd:#cfd8e4;--hl:#e8eef7;--red:#dc241f;--ok:#0e7a3a;--no:#c4231e;--focus:#0019a8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1424;--ink:#edf2fa;--mute:#94a4bb;--card:#13213a;--bd:#2b3d5c;--hl:#1c2e4d;--ok:#4cc47d;--no:#ff7a73;--focus:#8fa4ff}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Gill Sans","Gill Sans MT",Calibri,"Trebuchet MS",sans-serif}
#app{max-width:560px;margin:0 auto;padding:28px 18px 90px}
h1{font-size:2.4rem;line-height:1.05;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1rem;margin:1.6em 0 .5em}
.lede{color:var(--mute);max-width:46ch}
.hint{color:var(--mute);font-size:.9rem;margin:.5em 0 0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 14px;border:1.5px solid var(--bd);border-radius:999px;background:var(--card);color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{display:block;width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:700;font-size:1.05rem}
.go:disabled{background:var(--bd);color:var(--mute);cursor:not-allowed}
.bar{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:18px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:34px 1fr;column-gap:14px;position:relative}
.rail{position:relative}
.line .rail::before{content:"";position:absolute;left:12px;width:10px;top:-34px;bottom:-34px;background:var(--c,var(--bd))}
.stn .rail::after{content:"";position:absolute;z-index:2;left:5px;top:50%;width:24px;height:24px;margin-top:-12px;border:5px solid var(--ink);border-radius:50%;background:var(--card)}
.body{padding:14px 0;min-width:0}
.line .body{display:flex;flex-direction:column;gap:10px;padding:18px 0}
.stn small{display:block;color:var(--mute);font-size:.85rem}
.stn b{font-size:1.3rem}
.stn i{font-style:normal;color:var(--mute);margin-left:8px;font-size:.9rem}
.chg{display:flex;gap:6px;align-items:center}
.plus{align-self:flex-start;padding:7px 14px;border:1.5px dashed var(--mute);border-radius:999px;background:none;color:var(--ink)}
.rm{border:0;background:none;color:var(--mute);font-size:1.2rem;padding:6px 10px}
.locked{pointer-events:none}.locked .plus,.locked .rm{display:none}
.combo{position:relative;flex:1;min-width:0}
.combo input{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--bd);border-radius:6px;background:var(--card);color:var(--ink)}
.list{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);max-height:250px;overflow:auto;background:var(--card);border:1.5px solid var(--bd);border-radius:6px}
.opt{padding:9px 12px;border-left:7px solid transparent;cursor:pointer}
.opt.on,.opt:hover{background:var(--hl)}
#res{margin-top:24px}
#res h3{margin:0 0 .3em;font-size:1.5rem}
.ok{color:var(--ok)}.no{color:var(--no)}
.route{list-style:none;padding:0;margin:.8em 0 0;display:grid;gap:8px}
.route li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.route em{font-style:normal;color:var(--mute);font-size:.9rem}
.chip{padding:3px 10px;border-radius:5px;font-weight:700;font-size:.9rem;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script>
const $=(s)=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const norm=s=>s.toLowerCase().replace(/[’']/g,'');
const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const sum=o=>`${pl(o.changes,'change')}, ${pl(o.stops,'stop')}`;

/* ---------- build the graph ---------- */
const zone={},byId={},stLines={};
for(const L of NETWORK){
  byId[L.id]=L;L.adj={};
  for(const p of L.paths){
    let z=0,prev=null;
    for(let t of p.split(',')){
      t=t.trim();const m=t.match(/^@(\d+) (.+)$/);
      if(m){z=+m[1];t=m[2]}
      if(!(t in zone))zone[t]=z;
      (L.adj[t]??=new Set());
      if(prev&&prev!==t){L.adj[prev].add(t);L.adj[t].add(prev)}
      prev=t;
    }
  }
  for(const s in L.adj)(stLines[s]??=[]).push(L);
}
const STATIONS=Object.keys(zone).sort((a,b)=>a.localeCompare(b));
const stationItems=STATIONS.map(s=>({v:s,label:s}));
const lineItems=NETWORK.map(L=>({v:L.id,label:L.label,color:L.color}));

const ink=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000>150?'#0b1b33':'#fff'};
const chip=L=>`<span class="chip" style="background:${L.color};color:${ink(L.color)}">${esc(L.label)}</span>`;

/* ---------- route finding: fewest changes, then fewest stops ---------- */
function hops(L,a,b){
  if(!L.adj[a]||!L.adj[b])return -1;
  const d={[a]:0},q=[a];
  for(let i=0;i<q.length;i++){const s=q[i];if(s===b)return d[s];for(const n of L.adj[s])if(!(n in d)){d[n]=d[s]+1;q.push(n)}}
  return -1;
}
function shortest(a,b){
  const k=(s,l)=>s+'|'+l,dist=new Map(),prev=new Map(),done=new Set(),q=[];
  for(const L of stLines[a]){dist.set(k(a,L.id),0);q.push([0,a,L.id])}
  let end=null;
  while(q.length){
    let m=0;for(let i=1;i<q.length;i++)if(q[i][0]<q[m][0])m=i;
    const [d,s,l]=q.splice(m,1)[0],c=k(s,l);
    if(done.has(c))continue;done.add(c);
    if(s===b){end=[s,l];break}
    const go=(ns,nl,w)=>{const n=k(ns,nl);if(!dist.has(n)||d+w<dist.get(n)){dist.set(n,d+w);prev.set(n,[s,l]);q.push([d+w,ns,nl])}};
    for(const n of byId[l].adj[s])go(n,l,1);
    for(const L of stLines[s])if(L.id!==l)go(s,L.id,1000);
  }
  if(!end)return null;
  const st=[];for(let c=end;c;c=prev.get(k(...c)))st.unshift(c);
  const legs=[];
  for(const [s,l] of st){
    const g=legs[legs.length-1];
    if(g&&g.line===l){if(g.stops[g.stops.length-1]!==s)g.stops.push(s)}else legs.push({line:l,stops:[s]});
  }
  legs.forEach(g=>g.n=g.stops.length-1);
  return{legs,changes:legs.length-1,stops:legs.reduce((t,g)=>t+g.n,0)};
}

/* ---------- searchable dropdown ---------- */
function combo(items,ph,val,onPick){
  const w=el('div','combo'),inp=el('input'),ls=el('div','list');
  ls.hidden=true;inp.placeholder=ph;inp.setAttribute('autocomplete','off');inp.setAttribute('aria-label',ph);
  w.append(inp,ls);
  let q='',cur=val,on=-1,shown=[];
  const lab=v=>(items.find(i=>i.v===v)||{}).label||'';
  inp.value=lab(cur);
  const choose=i=>{cur=i.v;inp.value=i.label;ls.hidden=true;onPick(i.v);inp.blur()};
  const draw=()=>{
    shown=items.filter(i=>norm(i.label).includes(q));
    ls.replaceChildren(...shown.map((i,ix)=>{
      const d=el('div','opt'+(ix===on?' on':''),i.label);
      if(i.color)d.style.borderLeftColor=i.color;
      d.onmousedown=e=>{e.preventDefault();choose(i)};
      return d;
    }));
    ls.hidden=!shown.length;
    ls.children[on]?.scrollIntoView({block:'nearest'});
  };
  inp.onfocus=()=>{inp.select();q='';on=-1;draw()};
  inp.oninput=()=>{if(cur){cur='';onPick('')}q=norm(inp.value);on=0;draw()};
  inp.onkeydown=e=>{
    const k=e.key;
    if(k==='ArrowDown'||k==='ArrowUp'){
      e.preventDefault();if(ls.hidden)draw();if(!shown.length)return;
      on=(on+(k==='ArrowDown'?1:-1)+shown.length)%shown.length;draw();
    }else if(k==='Enter'){
      e.preventDefault();const i=shown[Math.max(on,0)];if(i&&!ls.hidden)choose(i);
    }else if(k==='Escape')inp.blur();
  };
  inp.onblur=()=>{ls.hidden=true;inp.value=lab(cur)};
  return w;
}

/* ---------- game state and screens ---------- */
const app=$('#app');
const g={zone:2,rounds:10};
const bestKey=()=>`tube-best-${g.zone}-${g.rounds}`;
const getBest=()=>{try{return+localStorage.getItem(bestKey())||0}catch{return 0}};
const setBest=v=>{try{localStorage.setItem(bestKey(),v)}catch{}};

function pills(p,vals,get,set,lab=v=>v){
  const r=()=>{p.innerHTML='';vals.forEach(v=>{
    const b=el('button','pill'+(get()===v?' on':''),lab(v));
    b.onclick=()=>{set(v);r()};p.append(b);
  })};r();
}

function showSetup(){
  app.innerHTML=`<h1>Fewest changes</h1>
  <p class="lede">Plan the shortest route across the Tube, Elizabeth line, DLR and Overground. Fewest changes wins; ties go to the fewest stops.</p>
  <h2>Difficulty: zones in play</h2><div id="zp" class="pills"></div><p class="hint" id="zi"></p>
  <h2>Rounds</h2><div id="rp" class="pills"></div>
  <button class="go" id="go">Start game</button>`;
  const info=()=>{$('#zi').textContent=`Journeys start and end in ${g.zone===1?'zone 1':'zones 1–'+g.zone}: ${STATIONS.filter(s=>zone[s]<=g.zone).length} stations to draw from.`};
  pills($('#zp'),[1,2,3,4,5,6,7,8,9],()=>g.zone,v=>{g.zone=v;info()},v=>v===1?'Zone 1':'1–'+v);
  pills($('#rp'),[5,10,20],()=>g.rounds,v=>{g.rounds=v});
  info();
  $('#go').onclick=()=>{g.round=0;g.score=0;g.streak=0;nextRound()};
}

function nextRound(){
  g.round++;
  const pool=STATIONS.filter(s=>zone[s]<=g.zone);
  let a,b,o;
  do{a=pool[Math.random()*pool.length|0];b=pool[Math.random()*pool.length|0];o=a!==b&&shortest(a,b)}while(!o||o.stops<2);
  Object.assign(g,{start:a,end:b,opt:o,legs:[''],changes:[]});
  app.innerHTML=`<div class="bar"><span>Round ${g.round} of ${g.rounds}</span><span>Score ${g.score}</span><span>Streak ${g.streak}</span></div>
  <div id="builder"></div><button class="go" id="sub" disabled>Submit route</button><div id="res"></div>`;
  $('#sub').onclick=submit;
  build();
}

const row=cls=>{const r=el('div','row '+cls),bd=el('div','body');r.append(el('div','rail'),bd);return[r,bd]};
const upd=()=>{$('#sub').disabled=!(g.legs.every(Boolean)&&g.changes.every(Boolean))};

function stRow(label,name){
  const[r,bd]=row('stn');
  bd.innerHTML=`<small>${label}</small><b>${esc(name)}</b><i>Zone ${zone[name]}</i>`;
  return r;
}
function lnRow(i){
  const[r,bd]=row('line');
  const paint=v=>r.style.setProperty('--c',v?byId[v].color:'');
  paint(g.legs[i]);
  bd.append(combo(lineItems,'Choose a line',g.legs[i],v=>{g.legs[i]=v;paint(v);upd()}));
  if(i===g.legs.length-1){
    const p=el('button','plus','+ Add change');
    p.onclick=()=>{g.legs.push('');g.changes.push('');build()};
    bd.append(p);
  }
  return r;
}
function chRow(i){
  const[r,bd]=row('stn');
  bd.innerHTML='<small>Change at</small>';
  const c=el('div','chg');
  c.append(combo(stationItems,'Choose a station',g.changes[i],v=>{g.changes[i]=v;upd()}));
  if(i===g.changes.length-1){
    const x=el('button','rm','✕');x.title='Remove this change';x.setAttribute('aria-label','Remove this change');
    x.onclick=()=>{g.legs.pop();g.changes.pop();build()};
    c.append(x);
  }
  bd.append(c);
  return r;
}
function build(){
  const b=$('#builder');b.innerHTML='';
  b.append(stRow('From',g.start));
  g.legs.forEach((_,i)=>{if(i>0)b.append(chRow(i-1));b.append(lnRow(i))});
  b.append(stRow('To',g.end));
  upd();
}

function judge(){
  const pts=[g.start,...g.changes,g.end];let total=0;
  for(let i=0;i<g.legs.length;i++){
    const L=byId[g.legs[i]],a=pts[i],b=pts[i+1];
    if(!L.adj[a])return{bad:`${a} isn’t on ${L.label}.`};
    if(!L.adj[b])return{bad:`${b} isn’t on ${L.label}.`};
    const h=hops(L,a,b);
    if(h<0)return{bad:`${L.label} doesn’t connect ${a} to ${b}.`};
    total+=h;
  }
  return{changes:g.legs.length-1,stops:total};
}
const routeHTML=o=>`<ol class="route">${o.legs.map(l=>`<li>${chip(byId[l.line])}<span>${esc(l.stops[0])} to ${esc(l.stops[l.n])}</span><em>${pl(l.n,'stop')}</em></li>`).join('')}</ol>`;

function submit(){
  $('#builder').classList.add('locked');$('#sub').hidden=true;
  const j=judge(),o=g.opt;
  const ok=!j.bad&&(j.changes<o.changes||(j.changes===o.changes&&j.stops<=o.stops));
  g.streak=ok?g.streak+1:0;if(ok)g.score++;
  const head=ok
    ?`<h3 class="ok">Correct</h3><p>${sum(j)}. That ties for the shortest route.</p>`
    :`<h3 class="no">${j.bad?'That route doesn’t work':'Not the shortest'}</h3><p>${j.bad?esc(j.bad):'Your route: '+sum(j)+'.'}</p><p>Shortest route: ${sum(o)}.</p>${routeHTML(o)}`;
  $('#res').innerHTML=head+`<button class="go" id="nx">${g.round<g.rounds?'Next round':'See results'}</button>`;
  $('#nx').onclick=()=>g.round<g.rounds?nextRound():showEnd();
  $('#nx').scrollIntoView({block:'nearest'});
}

function showEnd(){
  const prev=getBest();if(g.score>prev)setBest(g.score);
  app.innerHTML=`<h1>${g.score} of ${g.rounds}</h1>
  <p class="lede">${g.score===g.rounds?'A perfect run.':'Correct routes this game.'}</p>
  <p class="hint">Best on this setting: ${Math.max(prev,g.score)}</p>
  <button class="go" id="again">New game</button>`;
  $('#again').onclick=showSetup;
}

showSetup();
</script>
</body>
</html>
